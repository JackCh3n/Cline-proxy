<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主题切换预览</title>
<style>
:root{--bg:#ffffff;--bg2:#f6f8fa;--bg3:#eaeef2;--border:#d0d7de;--text:#1f2328;--text2:#636c76;--accent:#0969de;--green:#1a7f37;--red:#cf222e;--yellow:#9a6700;--blue:#0969de;--status-active-bg:#dafbe1;--status-cooldown-bg:#fff8c5;--status-expired-bg:#ffebe9;--btn-primary-bg:#1f6feb;--btn-primary-hover:#388bfd;--btn-success-bg:#1a7f37;--btn-success-hover:#238636;--btn-danger-hover-bg:#ffebe9;--toast-success-bg:#1a7f37;--toast-error-bg:#cf222e;--toast-info-bg:#1f6feb}
[data-theme="dark"]{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--blue:#58a6ff;--status-active-bg:#0e4429;--status-cooldown-bg:#3d2e00;--status-expired-bg:#3d1117;--btn-primary-bg:#1f6feb;--btn-primary-hover:#388bfd;--btn-success-bg:#1a7f37;--btn-success-hover:#238636;--btn-danger-hover-bg:#3d1117;--toast-success-bg:#1a7f37;--toast-error-bg:#f85149;--toast-info-bg:#1f6feb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--bg2);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0;display:flex;flex-direction:column}
.sidebar h1{font-size:16px;padding:0 16px 16px;border-bottom:1px solid var(--border);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sidebar h1 .theme-toggle{margin-left:auto;padding:3px 8px}
.sidebar h1 span{color:var(--accent)}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;color:var(--text2);transition:0.15s;border-left:2px solid transparent}
.nav-item:hover{color:var(--text);background:var(--bg3)}
.nav-item.active{color:var(--text);background:var(--bg3);border-left-color:var(--accent)}
.main{flex:1;padding:24px 32px;overflow-y:auto}
h2{font-size:20px;margin-bottom:16px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px}
.card .num{font-size:28px;font-weight:600}
.card .label{font-size:12px;color:var(--text2);margin-top:4px}
.card .num.green{color:var(--green)}
.card .num.red{color:var(--red)}
.card .num.yellow{color:var(--yellow)}
.card .num.blue{color:var(--blue)}
.section{background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:24px;overflow:hidden}
.section-title{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;display:flex;align-items:center;gap:8px}
.section-body{padding:16px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px}
th{color:var(--text2);font-weight:600;font-size:12px}
.status{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:500}
.status.active{background:var(--status-active-bg);color:var(--green)}
.status.cooldown{background:var(--status-cooldown-bg);color:var(--yellow)}
.status.expired{background:var(--status-expired-bg);color:var(--red)}
.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.status-dot.active{background:var(--green)}
.status-dot.cooldown{background:var(--yellow)}
.status-dot.expired{background:var(--red)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--bg3);color:var(--text);cursor:pointer;font-size:13px;transition:0.15s;text-decoration:none}
.btn:hover{background:var(--border)}
.btn-primary{background:var(--btn-primary-bg);border-color:var(--btn-primary-bg);color:#fff}
.btn-success{background:var(--btn-success-bg);border-color:var(--btn-success-bg);color:#fff}
.btn-danger{border-color:var(--red);color:var(--red)}
.theme-toggle{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg3);color:var(--text2);cursor:pointer;font-size:12px;transition:0.15s}
.theme-toggle:hover{color:var(--text);background:var(--border)}
.theme-toggle .icon{font-size:14px}
.note{background:var(--bg2);border:1px solid var(--accent);border-radius:8px;padding:12px 16px;margin-bottom:16px;color:var(--text2);font-size:13px}
.note strong{color:var(--accent)}
</style>
</head>
<body>
<div class="layout">
<div class="sidebar">
<h1><span>⚡</span>Cline 代理<button class="theme-toggle" onclick="toggleTheme()" title="切换主题"><span class="icon" id="themeIcon">☀️</span><span id="themeLabel">浅色</span></button></h1>
<div class="nav-item active"><span>📊</span> 仪表盘</div>
<div class="nav-item"><span>👤</span> 账号管理</div>
<div class="nav-item"><span>📥</span> 导入账号</div>
<div class="nav-item"><span>⚙️</span> 设置</div>
<div style="margin-top:auto;padding:16px;font-size:12px;color:var(--text2)">
  <div>管理面板: <a href="#" style="color:var(--accent)">/admin/</a></div>
  <div>API 地址: <span>http://127.0.0.1:3457</span></div>
</div>
</div>

<div class="main">
<h2>📊 仪表盘</h2>
<div class="note">这是主题切换预览页。点击右上角 <strong>☀️/🌙 按钮</strong> 可在浅色（默认）和深色之间切换，选择会通过 localStorage 持久化保存。</div>
<div class="cards">
  <div class="card"><div class="num blue">5</div><div class="label">账号总数</div></div>
  <div class="card"><div class="num green">3</div><div class="label">活跃</div></div>
  <div class="card"><div class="num yellow">1</div><div class="label">冷却</div></div>
  <div class="card"><div class="num red">1</div><div class="label">已过期</div></div>
</div>
<div class="section">
  <div class="section-title">📋 账号列表示例</div>
  <table>
    <thead><tr><th>邮箱</th><th>状态</th><th>使用次数</th><th>操作</th></tr></thead>
    <tbody>
      <tr><td>user1@example.com</td><td><span class="status active"><span class="status-dot active"></span>活跃</span></td><td>128</td><td><button class="btn">↻</button> <button class="btn btn-danger">✕</button></td></tr>
      <tr><td>user2@example.com</td><td><span class="status cooldown"><span class="status-dot cooldown"></span>冷却</span></td><td>300</td><td><button class="btn">↻</button> <button class="btn btn-danger">✕</button></td></tr>
      <tr><td>user3@example.com</td><td><span class="status expired"><span class="status-dot expired"></span>已过期</span></td><td>500</td><td><button class="btn">↻</button> <button class="btn btn-danger">✕</button></td></tr>
    </tbody>
  </table>
</div>
<div class="section">
  <div class="section-title">🔘 按钮样式</div>
  <div class="section-body" style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn btn-primary">主要按钮</button>
    <button class="btn btn-success">成功按钮</button>
    <button class="btn btn-danger">危险按钮</button>
    <button class="btn">普通按钮</button>
  </div>
</div>
</div>
</div>

<script>
function getTheme(){return localStorage.getItem('theme')||'light'}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeIcon').textContent=t==='dark'?'🌙':'☀️';
  document.getElementById('themeLabel').textContent=t==='dark'?'深色':'浅色';
}
function toggleTheme(){
  const cur=getTheme();const next=cur==='dark'?'light':'dark';
  localStorage.setItem('theme',next);applyTheme(next);
}
applyTheme(getTheme());
</script>
</body>
</html>
